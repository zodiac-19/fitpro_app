name: Build Expo APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies & EAS CLI
        run: |
          npm install -g npm@latest
          npm install -g eas-cli
          npm install

      - name: Run Build Check
        run: echo "Build environment is ready"
